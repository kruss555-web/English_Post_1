name: English Quiz Bot

on:
  schedule:
    # Время в UTC. ВАЖНО: если меняете время в cron, поменяйте ту же строку
    # и в условиях `if:` ниже (иначе шаг не сработает; проверка в начале это заметит).
    - cron: "0 8 * * *"    # утро: вопрос-викторина
    - cron: "0 15 * * *"   # день: отрывок из классики с иллюстрацией
    - cron: "30 2 * * *"   # ночь: пополнение банков вопросов и отрывков
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать"
        type: choice
        options:
          - post
          - passage
          - generate
          - build-passages
        default: post
      count:
        description: "Для generate и build-passages: сколько добавить (пусто = пополнить до цели)"
        required: false
        default: ""

permissions:
  contents: write

# Публикация и генерация не должны работать одновременно
concurrency:
  group: quiz-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Проверить, что расписание совпадает с условиями
        if: ${{ github.event_name == 'schedule' && !contains(fromJSON('["0 8 * * *","0 15 * * *","30 2 * * *"]'), github.event.schedule) }}
        run: |
          echo "::error::Время в cron не совпадает с условиями if в bot.yml. Поменяйте обе строки одинаково."
          exit 1

      - name: Опубликовать вопрос-викторину
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') || github.event.inputs.action == 'post' }}
        env:
          POST_KIND: quiz
          LEVEL_LINE: ${{ vars.LEVEL_LINE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # При ручном запуске публикуем даже если сегодня уже было
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          # Максимум публикаций каждого вида за день
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '1' }}
        run: python3 bot.py

      - name: Опубликовать отрывок с иллюстрацией
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 15 * * *') || github.event.inputs.action == 'passage' }}
        env:
          POST_KIND: passage
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '1' }}
        run: python3 bot.py

      - name: Пополнить банк вопросов
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *') || github.event.inputs.action == 'generate' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Необязательные настройки: Settings → Secrets and variables → Actions → Variables
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TARGET_SIZE: ${{ vars.TARGET_SIZE || '1000' }}
          EXPLANATION_LANG: ${{ vars.EXPLANATION_LANG || 'Russian' }}
          COUNT: ${{ github.event.inputs.count }}
        run: python3 generate.py

      - name: Пополнить банк отрывков с иллюстрациями
        if: ${{ !cancelled() && ((github.event_name == 'schedule' && github.event.schedule == '30 2 * * *') || github.event.inputs.action == 'build-passages') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EXPLANATION_LANG: ${{ vars.EXPLANATION_LANG || 'Russian' }}
          PASSAGES_TARGET: ${{ vars.PASSAGES_TARGET || '365' }}
          PASSAGES_COUNT: ${{ github.event.inputs.action == 'build-passages' && github.event.inputs.count || '' }}
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 build_passages.py

      - name: Сохранить изменения в репозитории
        if: ${{ always() }}
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add questions.json state.json passages.json state_passages.json
          if [ -d images ]; then git add images; fi
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "bot: update questions/passages/state"
            git pull --rebase
            git push
          fi
