name: English_Post_Lit — пополнение банка

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Сколько отрывков добавить (пусто = пополнить до цели PASSAGES_TARGET)"
        required: false
        default: ""
  # Ночное автопополнение выключено. Чтобы включить, уберите «#» перед тремя строками ниже.
  # schedule:
  #   - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: english-post-lit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Собрать отрывки с иллюстрациями
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Необязательные настройки: Settings → Secrets and variables → Actions → Variables
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EXPLANATION_LANG: ${{ vars.EXPLANATION_LANG || 'Russian' }}
          PASSAGES_TARGET: ${{ vars.PASSAGES_TARGET || '365' }}
          PASSAGES_COUNT: ${{ github.event.inputs.count }}
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 build_passages.py

      - name: Сохранить банк в репозитории
        if: ${{ always() }}
        run: |
          git config user.name "English_Post_Lit bot"
          git config user.email "english-post-lit-bot@users.noreply.github.com"
          git add passages.json
          if [ -d images ]; then git add images; fi
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "bot: update passages"
            git pull --rebase
            git push
          fi
